# 문단 큐레이션 원본. 사람이 이 파일을 편집하고
#   uv run --project backend python tools/extract_passages.py <pg64317.txt> works/gatsby
# 로 passages.jsonl을 다시 만든다. 원문 텍스트는 이 파일에 넣지 않는다.
