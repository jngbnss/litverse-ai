    passage_ids: [gatsby-ch03-p123, gatsby-ch03-p137]
    hotspot: {x: 90, y: 88}

dialogue_goals:
  - {character_id: jordan, goal_ko: 손님들이 개츠비를 두고 하는 소문을 들어 보기}
  - {character_id: gatsby, goal_ko: 개츠비와 전쟁 시절 이야기를 나누기}
  - {character_id: nick, goal_ko: 오늘 밤 개츠비에게서 받은 인상을 정리하기}

branches:
  - branch_id: w-nick-asks-rumor
    title_ko: 닉이 소문을 직접 묻는다면?
    premise_ko: >-
      개츠비가 정체를 밝힌 직후, 닉이 "사람을 죽였다는 소문이 있던데요"라고 그에게 직접 묻는다.
    diverges_at: t03-party-midnight
    affected_characters: [nick, gatsby, jordan]
    relation_changes:
      - {source: gatsby, target: nick, label_ko: 경계심}
      - {source: nick, target: gatsby, label_ko: 직접 확인하려 함}

discussion_questions_ko:
  - 손님들의 소문은 개츠비에 대해 무엇을 알려 주고, 손님들 자신에 대해서는 무엇을 알려 주는가?
  - 진짜지만 페이지가 잘리지 않은 책은 개츠비의 어떤 면을 닮았는가?
  - 수백 명이 모인 파티의 끝에서 개츠비가 홀로 서 있는 장면을 어떻게 읽을 수 있는가?
