[project]
name = "litverse-backend"
version = "0.1.0"
description = "LitVerse AI backend: canon engine, retrieval, character agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
embeddings = [
    "faiss-cpu>=1.15.1",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905", "E501"]  # line length is handled by ruff format
